<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Market Echo: historical patterns, rebased outcomes, optional AI explanations."><title>Market Echo</title><link rel="stylesheet" href="./web/style.css"></head><body>
<header><a class="brand" href="./"><span class="mark">m<span>e</span></span> Market Echo <small>by Wayne / Fieldnote</small></a><div class="header-right"><span class="local" data-t="local"></span><select id="language" aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></div></header>
<main><section class="intro"><p class="eyebrow" data-t="eyebrow"></p><h1 data-t="title"></h1><p class="lead" data-t="lead"></p></section>
<section class="controls"><div class="section-title"><h2 data-t="setup"></h2><span id="source-label"></span></div><form id="form"><div class="fields">
<label><span data-t="source"></span><select id="source"><option value="demo" data-t="demo"></option><option value="csv" data-t="csv"></option></select></label>
<label><span data-t="category"></span><select id="category"><option value="crypto" data-t="crypto"></option><option value="us" data-t="us"></option><option value="cn" data-t="cn"></option><option value="metals" data-t="metals"></option></select></label>
<label><span data-t="asset"></span><select id="asset"></select></label><label><span data-t="symbol"></span><input id="symbol" value="BTC/USDT" maxlength="40" required></label><label><span data-t="quote"></span><input id="quote" value="USDT" maxlength="20" required></label>
<label><span data-t="instrument"></span><select id="instrument"></select></label><label><span data-t="timeframe"></span><select id="timeframe"><option>5m</option><option>15m</option><option selected>1h</option><option>4h</option><option>1d</option></select></label><label><span data-t="horizon"></span><select id="horizon"></select></label></div>
<p id="market-help" class="help"></p><div id="upload-box" hidden><label class="upload"><span data-t="file"></span><input id="file" type="file" accept=".csv,text/csv"></label><p><span data-t="csvHelp"></span> <a href="./examples/synthetic-btc-1h.csv" download data-t="download"></a></p><label class="check"><input id="synthetic" type="checkbox"><span data-t="syntheticCheck"></span></label></div>
<div class="actions"><button type="submit" id="run" data-t="run"></button><button type="button" class="secondary" id="demo" data-t="reset"></button><p data-t="window"></p></div></form><p role="status" id="status" aria-live="polite"></p><p role="alert" id="error" hidden></p></section>
<section id="results" hidden><div class="section-title result-title"><h2 data-t="result"></h2><button class="text-button" id="export" data-t="export"></button></div><div class="result-meta"><strong id="result-name"></strong><span id="result-meta"></span></div>
<div class="price-cards" id="prices"></div><div class="conversion" id="conversion"></div><div class="notice" id="warnings"></div>
<article class="chart-panel"><div class="section-title"><h3 data-t="chart"></h3></div><p class="legend"><i class="ink"></i><span data-t="current"></span><i class="sage"></i><span data-t="selected"></span><i class="faint"></i><span data-t="others"></span></p><div id="chart" class="chart"></div><p class="chart-caption" data-t="chartNote"></p></article>
<div class="case-heading"><h3 data-t="cases"></h3><p data-t="casesHelp"></p></div><div class="table-wrap"><table><thead><tr><th data-t="case"></th><th data-t="date"></th><th data-t="similarity"></th><th data-t="historicalPrice"></th><th data-t="change"></th><th data-t="rebased"></th></tr></thead><tbody id="cases"></tbody></table></div><div id="detail" class="detail"></div><p class="footnote" data-t="footnote"></p>
<section class="ai-panel"><div class="section-title"><h2 data-t="aiTitle"></h2></div><p data-t="aiIntro"></p><p id="ai-runtime" class="help"></p><div class="ai-fields"><label><span data-t="provider"></span><select id="provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic / Claude</option><option value="compatible" data-t="compat"></option></select></label><label><span data-t="model"></span><input id="model" maxlength="120" placeholder="deepseek-chat" autocomplete="off"></label><label><span data-t="key"></span><input id="key" type="password" maxlength="512" autocomplete="off" spellcheck="false"></label></div><p id="ai-destination" class="help"></p><p class="help" data-t="privacy"></p><details><summary data-t="payload"></summary><pre id="payload"></pre></details><label class="check"><input type="checkbox" id="consent"><span data-t="consent"></span></label><div class="actions"><button id="explain" data-t="explain"></button><button id="clear-key" class="secondary" data-t="clearKey"></button></div><p role="status" id="ai-status" aria-live="polite"></p><div id="ai-result" hidden><p data-t="aiGenerated" class="footnote"></p><div id="ai-text"></div></div></section>
</section>
<section class="method"><p class="eyebrow">HOW IT WORKS</p><h2 data-t="method"></h2><div class="method-grid"><article><b data-t="m1"></b><p data-t="p1"></p></article><article><b data-t="m2"></b><p data-t="p2"></p></article><article><b data-t="m3"></b><p data-t="p3"></p></article></div><p class="footnote" data-t="dataOnly"></p></section></main><footer><span data-t="footer"></span><span data-t="privacyFooter"></span></footer><script type="module" src="./web/app.mjs"></script></body></html>
