<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Market Echo: historical patterns, rebased outcomes, optional AI explanations."><title>Market Echo</title><link rel="stylesheet" href="./web/style.css"></head><body>
<header><a class="brand" href="./"><span class="mark">m<span>e</span></span> Market Echo <small>by Wayne / Fieldnote</small></a><div class="header-right"><span class="local" data-t="local"></span><select id="language" aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select></div></header>
<main><section class="intro"><p class="eyebrow" data-t="eyebrow"></p><h1 data-t="title"></h1><p class="lead" data-t="lead"></p></section>
<section class="controls"><div class="section-title"><h2 data-t="setup"></h2><span id="source-label"></span></div><form id="form"><div class="fields">
<label><span data-t="source"></span><select id="source"><option value="demo" data-t="demo"></option><option value="csv" data-t="csv"></option><option value="remote" data-t="remoteSource"></option></select></label>
<label><span data-t="category"></span><select id="category"><option value="crypto" data-t="crypto"></option><option value="us" data-t="us"></option><option value="cn" data-t="cn"></option><option value="metals" data-t="metals"></option></select></label>
<label><span data-t="asset"></span><select id="asset"></select></label><label><span data-t="symbol"></span><input id="symbol" value="BTC/USDT" maxlength="40" required></label><label><span data-t="quote"></span><input id="quote" value="USDT" maxlength="20" required></label>
<label><span data-t="instrument"></span><select id="instrument"></select></label><label><span data-t="timeframe"></span><select id="timeframe"><option>5m</option><option>15m</option><option selected>1h</option><option>4h</option><option>1d</option></select></label><label><span data-t="horizon"></span><select id="horizon"></select></label></div>
<div class="fields depth-options"><label><span data-t="caseLimit"></span><select id="case-limit"><option>30</option><option>60</option><option>100</option></select></label><label><span data-t="cutoffLabel"></span><input id="cutoff" type="datetime-local" aria-describedby="cutoff-help"></label></div><p id="cutoff-help" class="help" data-t="cutoffHelp"></p><div id="remote-box" hidden><label><span data-t="remoteCount"></span><select id="remote-count"><option>1000</option><option selected>5000</option><option>10000</option></select></label><p class="help" data-t="remoteHelp"></p><button type="button" id="save-history" class="secondary" data-t="saveHistory" hidden></button></div><label class="check"><input id="replay-mode" type="checkbox"><span data-t="replayMode"></span></label><p class="help" data-t="replayHelp"></p><p id="market-help" class="help"></p><div id="upload-box" hidden><label><span data-t="csvFormat"></span><select id="csv-format"><option value="standard" data-t="formatStandard"></option><option value="binance" data-t="formatBinance"></option></select></label><label class="upload"><span data-t="file"></span><input id="file" type="file" multiple accept=".csv,text/csv"></label><p><span data-t="csvHelp"></span> <a href="./examples/synthetic-btc-1h.csv" download data-t="download"></a></p><div class="fields"><label><span data-t="providerName"></span><input id="data-provider" maxlength="120" autocomplete="off"></label><label><span data-t="adjustmentLabel"></span><select id="adjustment"><option value="unknown" data-t="adjustUnknown"></option><option value="raw" data-t="adjustRaw"></option><option value="adjusted" data-t="adjustDone"></option></select></label></div><p class="help" data-t="mergeHelp"></p><details><summary data-t="dataGuide"></summary><p data-t="dataGuideIntro"></p><ul><li>Crypto: <a href="https://github.com/binance/binance-public-data" target="_blank" rel="noreferrer">Binance Public Data</a></li><li><span data-t="us"></span>: <a href="https://www.alphavantage.co/documentation/#daily" target="_blank" rel="noreferrer">Alpha Vantage OHLCV</a></li><li><span data-t="cn"></span>: <a href="https://tushare.pro/document/2?doc_id=27" target="_blank" rel="noreferrer">Tushare daily</a></li><li><span data-t="metals"></span>: <span data-t="metalSource"></span></li></ul><p data-t="dataFormat"></p></details><label class="check"><input id="synthetic" type="checkbox"><span data-t="syntheticCheck"></span></label></div>
<div class="actions"><button type="submit" id="run" data-t="run"></button><button type="button" class="secondary" id="demo" data-t="reset"></button><p data-t="window"></p></div></form><button type="button" id="cancel-run" class="secondary" data-t="cancelRun" hidden></button><p role="status" id="status" aria-live="polite"></p><p role="alert" id="error" hidden></p></section>
<section id="results" hidden><div class="section-title result-title"><h2 data-t="result"></h2><button class="text-button" id="export" data-t="export"></button></div><div class="result-meta"><strong id="result-name"></strong><span id="result-meta"></span></div>
<section class="quality-panel"><h3 data-t="qualityTitle"></h3><div id="quality"></div></section><section id="replay-panel" class="quality-panel" hidden><h3 data-t="replayTitle"></h3><p id="replay-status"></p><button type="button" id="reveal" data-t="reveal"></button><p class="footnote" data-t="replayNote"></p></section><div class="price-cards" id="prices"></div><div class="conversion" id="conversion"></div><div class="notice" id="warnings"></div>
<article class="chart-panel"><div class="section-title"><h3 data-t="chart"></h3></div><p class="legend"><i class="ink"></i><span data-t="current"></span><i class="sage"></i><span data-t="selected"></span><i class="faint"></i><span data-t="others"></span></p><fieldset class="indicator-controls"><legend data-t="indicatorTitle"></legend><label class="check"><input type="checkbox" data-indicator="ma20"><span>MA 20</span></label><label class="check"><input type="checkbox" data-indicator="ma60"><span>MA 60</span></label><label class="check"><input type="checkbox" data-indicator="ma200"><span>MA 200</span></label><label class="check"><input type="checkbox" data-indicator="ema20"><span>EMA 20</span></label><label class="check"><input type="checkbox" data-indicator="ema60"><span>EMA 60</span></label></fieldset><p class="help" data-t="indicatorHelp"></p><div id="indicator-values" class="indicator-values"></div><div id="chart" class="chart"></div><p class="chart-caption" data-t="chartNote"></p></article>
<details class="match-panel"><summary data-t="matchTitle"></summary><div id="match-chart" class="chart"></div><p id="match-note" class="help"></p><div id="match-weights" class="help"></div></details><div class="case-heading"><h3 data-t="cases"></h3><p data-t="casesHelp"></p></div><div class="table-wrap"><table><thead><tr><th data-t="case"></th><th data-t="date"></th><th data-t="similarity"></th><th data-t="historicalPrice"></th><th data-t="change"></th><th data-t="rebased"></th></tr></thead><tbody id="cases"></tbody></table></div><div id="detail" class="detail"></div><p class="footnote" data-t="footnote"></p>
<section class="ai-panel"><div class="section-title"><h2 data-t="aiTitle"></h2></div><p data-t="aiIntro"></p><p id="ai-runtime" class="help"></p><div class="ai-fields"><label><span data-t="provider"></span><select id="provider"><option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic / Claude</option><option value="compatible" data-t="compat"></option></select></label><label><span data-t="model"></span><input id="model" maxlength="120" placeholder="deepseek-flash" autocomplete="off"></label><label><span data-t="key"></span><input id="key" type="password" maxlength="512" autocomplete="off" spellcheck="false"></label></div><p id="ai-destination" class="help"></p><p class="help" data-t="privacy"></p><div class="insight-tabs" role="group" aria-label="AI"><button type="button" class="secondary" data-insight="match" data-t="insightMatch" aria-pressed="true"></button><button type="button" class="secondary" data-insight="divergence" data-t="insightDivergence" aria-pressed="false"></button><button type="button" class="secondary" data-insight="compare" data-t="insightCompare" aria-pressed="false"></button></div><div id="insight-facts" class="help"></div><p class="help" data-t="aiResponsibility"></p><details><summary data-t="payload"></summary><pre id="payload"></pre></details><label class="check"><input type="checkbox" id="consent"><span data-t="consent"></span></label><div class="actions"><button id="explain" data-t="explain"></button><button id="clear-key" class="secondary" data-t="clearKey"></button></div><p role="status" id="ai-status" aria-live="polite"></p><div id="ai-result" hidden><p data-t="aiGenerated" class="footnote"></p><div id="ai-text"></div><p class="footnote" data-t="insightBoundary"></p></div></section>
</section>
<section class="method"><p class="eyebrow">HOW IT WORKS</p><h2 data-t="method"></h2><div class="method-grid"><article><b data-t="m1"></b><p data-t="p1"></p></article><article><b data-t="m2"></b><p data-t="p2"></p></article><article><b data-t="m3"></b><p data-t="p3"></p></article></div><p class="footnote" data-t="dataOnly"></p></section></main><footer><span data-t="footer"></span><span data-t="privacyFooter"></span></footer><script type="module" src="./web/app.mjs"></script></body></html>
